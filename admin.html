<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel | Lyli Silva Nail Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f0efeb;--ink:#141827;--mut:#666a76;--line:#d8d5cc;--card:#f8f7f3;--gold:#9c7f4f;--ok:#2f6b3f;--bad:#7a1f1f;box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.6 Jost,system-ui,sans-serif}main{max-width:560px;margin:auto;padding:36px 20px 60px}button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ink);outline-offset:3px}[hidden]{display:none!important}h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.15;margin:0}h1{font-size:32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.mut{color:var(--mut);font-size:15px}.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;padding:13px 26px;font-weight:400;letter-spacing:.04em;cursor:pointer}.btn:hover{opacity:.86}.btn[disabled]{opacity:.35;cursor:not-allowed}.btn.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}.btn.sm{padding:9px 16px;font-size:15px}input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font-size:18px;border-radius:0}#login{margin-top:12vh;text-align:center}#login form{margin-top:28px;text-align:left}#login .btn{width:100%;margin-top:22px;padding:16px}.erro,#msg{min-height:1.6em;margin:14px 0 0;font-size:15px;color:var(--bad)}.cal{background:var(--card);border:1px solid var(--line);padding:16px 12px 12px}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calhead span{font:600 22px "Cormorant Garamond",serif;text-transform:capitalize}.calhead button{width:42px;height:42px;background:none;border:0;font-size:26px;cursor:pointer}.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.wk span{font-size:12px;color:var(--mut);padding-bottom:6px}.grid button{position:relative;aspect-ratio:1;background:none;border:1px solid transparent;border-radius:50%;font-size:16px;cursor:pointer}.grid button:hover:not(:disabled){border-color:var(--ink)}.grid button:disabled{color:#b3b4b8;cursor:default}.grid button.tem:after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}.grid button.cheio:after{background:var(--bad)}.grid button.hoje{border-color:var(--line);font-weight:500}.grid button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.grid button[aria-pressed=true]:after{background:var(--bg)}.leg{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px 0;font-size:13px;color:var(--mut)}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--gold)}.leg i.r{background:var(--bad)}h2{font-size:26px;margin:34px 0 4px}.dsel:first-letter{text-transform:uppercase}.slot{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-top:8px}.slot b{font-weight:500;font-size:20px;margin-right:10px}.tag{font-size:14px}.livre{color:var(--ok)}.marcado{color:var(--bad)}
  </style>
</head>
<body>
  <main>
    <section id="login" hidden>
      <h1>Área administrativa</h1><p class="mut">Acesso restrito.</p>
      <form id="fLogin" autocomplete="on">
        <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
        <p class="erro" id="eLogin" role="alert"></p>
        <button class="btn" id="bLogin" type="submit">Entrar</button>
      </form>
    </section>
    <section id="painel" hidden>
      <div class="top"><h1>Agenda</h1><button class="btn line sm" id="sair" type="button">Sair</button></div>
      <div class="cal">
        <div class="calhead"><button type="button" id="prev" aria-label="Mês anterior">‹</button><span id="mes"></span><button type="button" id="next" aria-label="Próximo mês">›</button></div>
        <div class="wk" aria-hidden="true"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="leg"><span><i></i>com horário marcado</span><span><i class="r"></i>dia lotado</span></div>
      <div id="dia" hidden><h2 class="dsel" id="dsel"></h2><p class="mut">Toque em Bloquear para fechar um horário, ou em Liberar para abrir um horário marcado.</p><div id="slots"></div></div>
      <p id="msg" role="alert"></p>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id),TIMES=["09:30","14:00","18:00"],pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,rot=t=>t==="09:30"?"9h30":t.slice(0,2)+"h",extenso=s=>new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
    let token="",dados={},dia=null;try{token=sessionStorage.getItem("adm")||""}catch(e){}const hoje=new Date();hoje.setHours(12,0,0,0);const sHoje=iso(hoje);let vista=new Date(hoje.getFullYear(),hoje.getMonth(),1,12);
    const msg=t=>$("msg").textContent=t||"";
    async function call(action,extra={}){try{const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({action,...extra})});let j;try{j=await r.json()}catch(e){j={error:`Backend indisponível (erro ${r.status}).`}}if(r.status===401&&action!=="login")sair(j.error);return{r,j}}catch(e){return{r:{ok:false,status:0},j:{error:"Sem conexão. Verifique a internet."}}}}
    function telaLogin(aviso=""){$("painel").hidden=true;$("login").hidden=false;$("eLogin").textContent=aviso;$("senha").value="";$("senha").focus()}function telaPainel(){$("login").hidden=true;$("painel").hidden=false;carregarMes()}function sair(aviso=""){token="";try{sessionStorage.removeItem("adm")}catch(e){}telaLogin(typeof aviso==="string"?aviso:"")}
    $("sair").onclick=()=>sair();$("fLogin").onsubmit=async e=>{e.preventDefault();const b=$("bLogin");b.disabled=true;b.textContent="Entrando...";$("eLogin").textContent="";const{r,j}=await call("login",{password:$("senha").value});b.disabled=false;b.textContent="Entrar";if(!r.ok){$("eLogin").textContent=j.error||"Não foi possível entrar.";$("senha").select();return}token=j.token;try{sessionStorage.setItem("adm",token)}catch(e){}telaPainel()};
    async function carregarMes(){const y=vista.getFullYear(),m=vista.getMonth(),total=new Date(y,m+1,0).getDate();msg("");const{r,j}=await call("range",{from:iso(new Date(y,m,1,12)),days:total});if(!r.ok){msg(j.error||"Não foi possível carregar a agenda.");return}dados=Object.assign(dados,j.days);desenhar();if(dia)mostrarDia()}
    function desenhar(){const y=vista.getFullYear(),m=vista.getMonth();$("mes").textContent=vista.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});const g=$("grid");g.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)g.appendChild(document.createElement("span"));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const s=iso(new Date(y,m,d,12)),taken=dados[s]||[],b=document.createElement("button");b.type="button";b.textContent=d;b.disabled=s<sHoje;b.className=[s===sHoje?"hoje":"",taken.length?"tem":"",taken.length>=TIMES.length?"cheio":""].filter(Boolean).join(" ");b.setAttribute("aria-pressed",String(s===dia));b.setAttribute("aria-label",extenso(s)+(taken.length?`, ${taken.length} horário(s) marcado(s)`: ", livre"));b.onclick=()=>{dia=s;desenhar();mostrarDia()};g.appendChild(b)}}
    $("prev").onclick=()=>{vista=new Date(vista.getFullYear(),vista.getMonth()-1,1,12);carregarMes()};$("next").onclick=()=>{vista=new Date(vista.getFullYear(),vista.getMonth()+1,1,12);carregarMes()};
    function mostrarDia(){$("dia").hidden=false;$("dsel").textContent=extenso(dia);const taken=dados[dia]||[],box=$("slots");box.innerHTML="";TIMES.forEach(t=>{const marcado=taken.includes(t),row=document.createElement("div"),info=document.createElement("div"),btn=document.createElement("button");row.className="slot";info.innerHTML=`<b>${rot(t)}</b><span class="tag ${marcado?"marcado":"livre"}">${marcado?"Marcado":"Livre"}</span>`;btn.type="button";btn.className="btn sm "+(marcado?"line":"");btn.textContent=marcado?"Liberar":"Bloquear";btn.onclick=()=>agir(marcado?"free":"block",t,btn);row.append(info,btn);box.appendChild(row)})}
    async function agir(acao,t,btn){if(acao==="free"&&!confirm(`Liberar o horário das ${rot(t)}? Se houver uma cliente marcada, ela perde a reserva.`))return;msg("");btn.disabled=true;const{r,j}=await call(acao,{date:dia,time:t});if(j.taken)dados[dia]=j.taken;if(!r.ok)msg(j.error||"Não foi possível concluir a ação.");desenhar();mostrarDia()}
    if(token)telaPainel();else telaLogin();
  </script>
</body>
</html>
