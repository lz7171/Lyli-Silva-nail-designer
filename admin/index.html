<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Lyli Silva Nail Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<main>
  <h1>Painel</h1>
  <p class="sub">Lyli Silva Nail Designer</p>

  <section id="login">
    <p id="erroLogin" role="alert"></p>
    <input id="senha" type="password" placeholder="Senha" aria-label="Senha do painel" autocomplete="current-password">
    <button class="btn wide" id="entrar" type="button">Entrar</button>
  </section>

  <div id="painel" hidden>
    <div class="topo">
      <button class="btn out small menuBtn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">
        <span class="ico" aria-hidden="true"><i></i><i></i><i></i></span> Menu
      </button>
      <span class="abaAtual" id="abaAtual">Agenda</span>
      <span class="grow"></span>
      <button class="btn out small" id="atualizar" type="button">Atualizar</button>
    </div>
    <nav class="menu" id="menu" aria-label="Seções do painel" hidden>
      <button type="button" data-aba="agenda" aria-current="page">Agenda</button>
      <button type="button" data-aba="horarios">Horários e dias</button>
      <button type="button" data-aba="site">Site</button>
      <button type="button" data-aba="lembretes">Lembretes</button>
      <a href="/" target="_blank" rel="noopener">Ver o site</a>
      <button type="button" id="sair">Sair</button>
    </nav>
    <div id="aba-agenda" class="painelAba"></div>
    <div id="aba-horarios" class="painelAba" hidden></div>
    <div id="aba-site" class="painelAba" hidden></div>
    <div id="aba-lembretes" class="painelAba" hidden></div>
  </div>
  <footer>Lyli Silva Nail Designer</footer>
</main>
<dialog id="dlgFotos"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/admin/js/main.js"></script>
</body>
</html>
